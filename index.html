<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전국 화재정보 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#fff7f2;--card:#ffffff;--accent:#e8482b;--accent2:#ff7a45;--ink:#2b2320;--muted:#8a7f79;--line:#f0e2da;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
.wrap{max-width:1200px;margin:0 auto;padding:16px;}
.banner{background:linear-gradient(120deg,#e8482b,#ff7a45 60%,#ffb347);border-radius:18px;padding:22px 26px;color:#fff;box-shadow:0 8px 24px rgba(232,72,43,.25);}
.banner h1{margin:0 0 4px;font-size:22px;font-weight:800;}
.banner .snap{font-size:12px;opacity:.9;margin-bottom:16px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kpi{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;}
.kpi .lbl{font-size:12px;opacity:.92;}
.kpi .val{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;}
.kpi .val small{font-size:13px;font-weight:600;opacity:.9;}
.section{margin-top:22px;}
.section h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.section h2:before{content:"";width:6px;height:20px;background:var(--accent);border-radius:3px;display:inline-block;}
.tagbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.tag{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s;}
.tag:hover{border-color:var(--accent2);}
.tag.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.card{background:var(--card);border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.05);overflow:hidden;}
.list-head{padding:10px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:700;}
.item{padding:11px 16px 11px 20px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:.12s;}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent2);}
.item:hover{background:#fff3ec;}
.item .t{font-size:14px;font-weight:600;margin-bottom:3px;}
.item .m{font-size:12px;color:var(--muted);}
.item .reg{display:inline-block;background:#ffe8de;color:var(--accent);border-radius:6px;padding:1px 7px;font-size:11px;margin-right:6px;font-weight:700;}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px;}
.pbtn{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;}
.pbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.pbtn.dots{border:none;background:none;cursor:default;}
#map{height:560px;width:100%;border-radius:14px;}
.news-list{max-height:560px;overflow-y:auto;}
.news-item{padding:12px 16px;border-bottom:1px solid var(--line);}
.news-item a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;line-height:1.4;}
.news-item a:hover{color:var(--accent);}
.news-meta{margin-top:5px;font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center;}
.badge{background:#ffe8de;color:var(--accent);border-radius:5px;padding:1px 7px;font-weight:700;}
.stat-controls{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fff;}
.stat-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.skpi{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.05);border-left:5px solid var(--accent);}
.skpi .lbl{font-size:12px;color:var(--muted);}
.skpi .val{font-size:26px;font-weight:800;margin-top:4px;}
.skpi .val small{font-size:12px;color:var(--muted);font-weight:600;}
.foot{margin:26px 0 10px;font-size:12px;color:var(--muted);line-height:1.7;}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}.live-grid{grid-template-columns:1fr;}.stat-kpis{grid-template-columns:repeat(2,1fr);}#map{height:380px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <h1>🔥 전국 화재정보 대시보드</h1>
    <div class="snap">스냅샷 생성 시각: 2026-07-05 14:15 KST</div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">화재 접수</div><div class="val">442<small>건</small></div></div>
      <div class="kpi"><div class="lbl">진행 중</div><div class="val">111<small>건</small></div></div>

  <div class="section">

    <div class="tagbar" id="tagbar"></div>

      <div class="card">
        <div class="list-head" id="listHead">전체</div>
        <div id="list"></div>
        <div class="pager" id="pager"></div>

    </div>
  </div>

  <div class="section">
    <h2>오늘의 화재 뉴스</h2>

  </div>

  <div class="section">

    <div class="stat-controls">

    </div>
    <div class="stat-kpis">

      <div class="skpi"><div class="lbl">재산 피해</div><div class="val" id="s_prpt">-</div></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const fmt = n => (n||0).toLocaleString('ko-KR');
let curRegion = '전체';
let curPage = 1;
const PER = 8;

// ---- tag bar ----
function buildTags(){
  const bar = document.getElementById('tagbar');
  const total = DATA.liveItems.length;
  let html = `<div class="tag active" data-r="전체">전체(${total})</div>`;
  DATA.regionOrder.forEach(r=>{ html += `<div class="tag" data-r="${r}">${r}(${DATA.regionCounts[r]})</div>`; });
  bar.innerHTML = html;
  bar.querySelectorAll('.tag').forEach(t=>t.addEventListener('click',()=>{
    bar.querySelectorAll('.tag').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    curRegion = t.dataset.r; curPage = 1;
    renderList(); renderMap();
  }));
}
function filtered(){ return curRegion==='전체'?DATA.liveItems:DATA.liveItems.filter(i=>i.region===curRegion); }

// ---- list + pagination ----
let markers = [], map, mapLayer;
function renderList(){
  const items = filtered();
  document.getElementById('listHead').textContent = (curRegion==='전체'?'전체':curRegion)+' '+items.length+'건';
  const list = document.getElementById('list');
  if(items.length===0){ list.innerHTML='<div class="empty">해당 지역의 화재 정보가 없습니다</div>'; document.getElementById('pager').innerHTML=''; return; }
  const pages = Math.ceil(items.length/PER);
  if(curPage>pages) curPage=1;
  const start=(curPage-1)*PER;
  const slice=items.slice(start,start+PER);
  list.innerHTML = slice.map((it,idx)=>{
    const gi = DATA.liveItems.indexOf(it);
    return `<div class="item" data-i="${gi}"><div class="t">${it.type}</div><div class="m"><span class="reg">${it.region}</span>${it.loc} · ${it.time}</div></div>`;
  }).join('');
  list.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>{
    const it = DATA.liveItems[+el.dataset.i];
    if(it.lat&&map){ map.flyTo([it.lat,it.lng],15); const mk=markers.find(m=>m._it===it); if(mk) mk.openPopup(); }
  }));
  renderPager(pages);
}
function renderPager(pages){
  const p=document.getElementById('pager');
  if(pages<=1){p.innerHTML='';return;}
  let nums=[];
  const cur=curPage;
  const push=(n)=>nums.push(n);
  if(pages<=7){ for(let i=1;i<=pages;i++)push(i); }
  else {
    push(1);
    if(cur>3)push('...');
    for(let i=Math.max(2,cur-1);i<=Math.min(pages-1,cur+1);i++)push(i);
    if(cur<pages-2)push('...');
    push(pages);
  }
  let html = `<button class="pbtn" data-p="${Math.max(1,cur-1)}">‹</button>`;
  nums.forEach(n=>{ html += n==='...'?`<span class="pbtn dots">…</span>`:`<button class="pbtn ${n===cur?'active':''}" data-p="${n}">${n}</button>`; });
  html += `<button class="pbtn" data-p="${Math.min(pages,cur+1)}">›</button>`;
  p.innerHTML=html;
  p.querySelectorAll('button[data-p]').forEach(b=>b.addEventListener('click',()=>{curPage=+b.dataset.p;renderList();}));
}

// ---- map ----
function initMap(){
  try{
    map = L.map('map').setView([36.5,127.8],7);
    mapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'});
    mapLayer.addTo(map);
    renderMap();
  }catch(e){ document.getElementById('map').innerHTML='<div class="empty">지도를 표시하려면 인터넷 연결이 필요합니다</div>'; }
}
function renderMap(){
  if(!map)return;
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  const items=filtered().filter(i=>i.lat&&i.lng);
  const bounds=[];
  items.forEach(it=>{
    const mk=L.circleMarker([it.lat,it.lng],{radius:7,color:'#e8482b',fillColor:'#ff5a36',fillOpacity:.85,weight:2});
    mk._it=it;
    mk.bindPopup(`<b>${it.type}</b><br>${it.loc}<br><small>${it.time}</small>`);
    mk.addTo(map); markers.push(mk); bounds.push([it.lat,it.lng]);
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[30,30],maxZoom:12});
}

// ---- news ----
function renderNews(){
  const nl=document.getElementById('newsList');
  if(!DATA.news.length){ nl.innerHTML='<div class="empty">최근 24시간 건물화재 뉴스가 없습니다</div>'; return; }
  nl.innerHTML=DATA.news.map(n=>`<div class="news-item"><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a><div class="news-meta"><span class="badge">${n.source}</span><span>${n.time}</span></div></div>`).join('');
}

// ---- sido stats ----
function buildSido(){
  const sel=document.getElementById('sidoSel');
  let html=`<option value="__ALL__">전국</option>`;
  DATA.sidoData.forEach((s,i)=>{ html+=`<option value="${i}">${s.name}</option>`; });
  sel.innerHTML=html;
  sel.addEventListener('change',updateSido);
  updateSido();
}
function updateSido(){
  const v=document.getElementById('sidoSel').value;
  let d;
  if(v==='__ALL__') d=DATA.total; else d=DATA.sidoData[+v];
  document.getElementById('s_rcpt').innerHTML=fmt(d.rcpt)+' <small>건</small>';
  document.getElementById('s_prog').innerHTML=fmt(d.prog)+' <small>건</small>';
  document.getElementById('s_life').innerHTML=fmt(d.life)+' <small>명</small>';
  document.getElementById('s_prpt').innerHTML=fmt(d.prpt)+' <small>천원</small>';
}
