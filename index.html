<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전국 화재정보 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#fff7f2;--card:#ffffff;--accent:#e8462a;--accent2:#ff7a45;--ink:#2b2320;--muted:#8a807b;--line:#f0e2da;--chip:#fff0e9;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}
.banner{background:linear-gradient(120deg,#e8462a,#ff7a45 60%,#ffab5e);border-radius:20px;padding:26px 28px;color:#fff;box-shadow:0 10px 30px rgba(232,70,42,.25);}
.banner h1{margin:0 0 4px;font-size:24px;letter-spacing:-.5px;}
.banner .sub{opacity:.92;font-size:13px;margin-bottom:20px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kpi{background:rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;backdrop-filter:blur(2px);}
.kpi .lab{font-size:13px;opacity:.9;}
.kpi .val{font-size:30px;font-weight:800;line-height:1.15;margin-top:2px;}
.kpi .unit{font-size:13px;font-weight:600;opacity:.85;margin-left:3px;}
.sec{margin-top:26px;}
.sec-title{font-size:18px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.sec-title:before{content:"";width:6px;height:20px;background:var(--accent);border-radius:4px;display:inline-block;}
.tagbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.tag{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;}
.tag:hover{border-color:var(--accent2);}
.tag.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:820px){.grid2{grid-template-columns:1fr;}.kpis{grid-template-columns:repeat(2,1fr);}}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.05);}
.listhead{font-size:13px;color:var(--muted);margin:2px 4px 10px;font-weight:600;}
.item{border-left:4px solid var(--accent);background:#fffaf7;border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer;transition:.12s;}
.item:hover{background:var(--chip);transform:translateX(2px);}
.item .t{font-weight:700;font-size:14px;}
.item .l{font-size:13px;color:#5c524d;margin-top:2px;}
.item .m{font-size:12px;color:var(--muted);margin-top:3px;}
.item .rg{display:inline-block;background:var(--chip);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:6px;}
.pager{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px;}
.pager button{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);}
.pager button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.pager span{padding:0 4px;color:var(--muted);align-self:center;}
#map{height:520px;border-radius:12px;}
.newscard{border-left:4px solid var(--accent2);background:#fffaf7;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.newscard a{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;}
.newscard a:hover{color:var(--accent);}
.newsmeta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center;}
.badge{background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;}
.newslist{max-height:520px;overflow-y:auto;padding-right:4px;}
.statrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fff;}
.statkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:820px){.statkpis{grid-template-columns:repeat(2,1fr);}}
.skpi{border-left:4px solid var(--accent);background:#fffaf7;border-radius:12px;padding:14px;}
.skpi .lab{font-size:13px;color:var(--muted);}
.skpi .val{font-size:26px;font-weight:800;margin-top:3px;}
.foot{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.7;}
.foot b{color:#5c524d;}
.empty{padding:30px;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">

      </div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

  add('‹',curPage-1,false,curPage===1);
  const win=2; let pset=new Set([1,pages,curPage]);
  for(let d=1;d<=win;d++){pset.add(curPage-d);pset.add(curPage+d);}
  const ps=[...pset].filter(x=>x>=1&&x<=pages).sort((a,b)=>a-b);
  let prev=0;
  ps.forEach(pg=>{ if(pg-prev>1)add('...'); add(String(pg),pg,pg===curPage,false); prev=pg; });
  add('›',curPage+1,false,curPage===pages);
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

let markers=[];
function openPop(it){
  markers.forEach(m=>{ if(m.__it===it){ m.openPopup(); } });
}
function drawMarkers(fit){
  if(!map) return;
  if(layer) layer.clearLayers();
  markers=[];
  const arr=filtered().filter(it=>it.lat!=null&&it.lng!=null);
  const pts=[];
  arr.forEach(it=>{
    const m=L.circleMarker([it.lat,it.lng],{radius:7,color:'#e8462a',weight:2,fillColor:'#ff7a45',fillOpacity:.75});
    m.bindPopup('<b>'+esc(it.type)+'</b><br>'+esc(it.loc)+'<br><span style="color:#888">'+esc(it.time)+'</span>');
    m.__it=it; m.addTo(layer); markers.push(m); pts.push([it.lat,it.lng]);
  });
  if(fit&&pts.length){ map.fitBounds(pts,{padding:[30,30],maxZoom:13}); }
}
function initMap(){
  try{
    map=L.map('map',{scrollWheelZoom:true}).setView([36.5,127.8],7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    layer=L.layerGroup().addTo(map);
    drawMarkers(true);
  }catch(e){ document.getElementById('map').innerHTML='<div class="empty">지도를 불러올 수 없습니다(오프라인)</div>'; }
}

// ---------- news ----------
function renderNews(){
  const el=document.getElementById('newslist');
  if(!DATA.news.length){ el.innerHTML='<div class="empty">최근 24시간 건물화재 뉴스가 없습니다</div>'; return; }
  el.innerHTML = DATA.news.map(n=>
    '<div class="newscard"><a href="'+n.url+'" target="_blank" rel="noopener">'+esc(n.title)+'</a>'
    +'<div class="newsmeta"><span class="badge">'+esc(n.source)+'</span><span>'+esc(n.time)+'</span></div></div>'
  ).join('');
}

// ---------- sido stats ----------
function initStats(){
  const sel=document.getElementById('sidoSel');
  const opt=document.createElement('option');opt.value='전국';opt.textContent='전국';sel.appendChild(opt);
  DATA.sidoData.forEach(s=>{const o=document.createElement('option');o.value=s.sido;o.textContent=s.sido;sel.appendChild(o);});
  sel.onchange=()=>updateStats(sel.value);
  updateStats('전국');
}
function updateStats(name){
  let d = name==='전국' ? DATA.total : DATA.sidoData.find(s=>s.sido===name);
  if(!d){d={rcpt:0,prog:0,life:0,prpt:0};}
  document.getElementById('s_rcpt').textContent=fmt(d.rcpt);
  document.getElementById('s_prog').textContent=fmt(d.prog);
  document.getElementById('s_life').textContent=fmt(d.life);
  document.getElementById('s_prpt').textContent=fmt(d.prpt);
}

renderTags(); renderList(); renderNews(); initStats(); initMap();
</script>
