<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전국 화재정보 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#fff7f2;--card:#fff;--ink:#241a16;--sub:#7a6a62;--line:#f0ddd2;
--red:#e5342a;--orange:#ff7a1a;--amber:#ffb020;--green:#12a150;--gray:#9aa0a6;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
.banner{background:linear-gradient(120deg,#e5342a 0%,#ff7a1a 55%,#ffb020 100%);
color:#fff;border-radius:18px;padding:22px 24px;box-shadow:0 10px 26px rgba(229,52,42,.22)}
.banner h1{margin:0 0 2px;font-size:22px;letter-spacing:-.4px}
.banner .sub{opacity:.94;font-size:12.5px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);
border-radius:12px;padding:12px 14px}
.kpi .lb{font-size:11.5px;opacity:.95}
.kpi .vl{font-size:27px;font-weight:800;line-height:1.15;margin-top:2px}
.kpi .un{font-size:12px;font-weight:600;opacity:.9;margin-left:2px}
.note{margin-top:12px;font-size:11.5px;background:rgba(0,0,0,.16);
border-radius:9px;padding:8px 11px;line-height:1.6}
.card{background:var(--card);border-radius:16px;padding:18px;margin-top:16px;
box-shadow:0 3px 14px rgba(120,70,50,.09);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--orange)}
.card.c-red::before{background:var(--red)}
.card.c-amber::before{background:var(--amber)}
.card h2{margin:0 0 3px;font-size:16.5px;letter-spacing:-.3px}
.card .desc{margin:0 0 14px;font-size:12px;color:var(--sub)}
.tagbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tag{border:1px solid var(--line);background:#fffaf7;color:var(--ink);
border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-weight:600}
.tag:hover{border-color:var(--orange)}
.tag.on{background:var(--red);border-color:var(--red);color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.listhd{font-size:12.5px;color:var(--sub);margin-bottom:8px;font-weight:600}
.item{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fffdfb}
.item:hover{border-color:var(--orange);background:#fff6ef}
.item .tp{font-size:13px;font-weight:700;margin-bottom:3px}
.item .lc{font-size:12px;color:var(--sub)}
.item .mt{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap}
.tm{font-size:11.5px;color:var(--red);font-weight:700}
.bdg{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:700}
.bdg.ok{background:#e4f7ec;color:var(--green)}
.bdg.no{background:#f1f1f1;color:var(--gray)}
#map{width:100%;height:470px;border-radius:12px;border:1px solid var(--line)}
.pager{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pg{border:1px solid var(--line);background:#fff;border-radius:8px;
padding:5px 10px;font-size:12px;cursor:pointer}
.pg:hover{border-color:var(--orange)}
.pg.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.pg.dis{opacity:.4;cursor:default}
.dots{padding:0 3px;color:var(--sub);font-size:12px}
.empty{padding:26px;text-align:center;color:var(--sub);font-size:13px;
border:1px dashed var(--line);border-radius:11px}
.nw{border-bottom:1px solid var(--line);padding:11px 2px}
.nw:last-child{border-bottom:0}
.nw a{color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:700;line-height:1.45}
.nw a:hover{color:var(--red)}
.nw .dz{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.nw .mz{margin-top:6px;display:flex;gap:7px;align-items:center}
.sbz{font-size:10.5px;background:#fff0e6;color:#c2410c;padding:2px 8px;border-radius:999px;font-weight:700}
.newswrap{max-height:400px;overflow-y:auto}
.selrow{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
select{border:1px solid var(--line);border-radius:9px;padding:8px 12px;
font-size:13.5px;background:#fff;color:var(--ink);font-weight:600;min-width:190px}
.skpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sk{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fffaf7}
.sk .lb{font-size:11.5px;color:var(--sub)}
.sk .vl{font-size:24px;font-weight:800;margin-top:3px;color:var(--red)}
.sk .vl small{font-size:12px;font-weight:600;color:var(--sub);margin-left:2px}
.sk.na .vl{color:var(--gray)}
.foot{margin-top:20px;font-size:11.5px;color:var(--sub);line-height:1.85;
background:#fff;border-radius:14px;padding:16px 18px}
.foot b{color:var(--ink)}
@media(max-width:900px){.split{grid-template-columns:1fr}.kpis,.skpi{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">

<div class="banner">
  <h1>전국 화재정보 대시보드</h1>
  <div class="sub">스냅샷 생성 시각: 2026-07-29 00:40 (KST) &nbsp;·&nbsp; 시도별 통계 기준일: 2026-07-28</div>

    <div class="kpi"><div class="lb">진행 중</div><div class="vl" id="kP">-<span class="un">건</span></div></div>
    <div class="kpi"><div class="lb">인명피해</div><div class="vl" id="kL">-<span class="un">명</span></div></div>
    <div class="kpi"><div class="lb">재산피해</div><div class="vl" id="kD">-<span class="un">천원</span></div></div>
  </div>
  <div class="note" id="bnote"></div>
</div>

<div class="card c-red">
  <h2>실시간 화재정보 <span style="font-size:12px;font-weight:500;color:var(--sub)">(국민안전24)</span></h2>
  <p class="desc" id="matchline"></p>
  <div class="tagbar" id="tags"></div>
  <div class="split">
    <div>
      <div class="listhd" id="lhd"></div>
      <div id="list"></div>
      <div class="pager" id="pager"></div>

    <div><div id="map"></div></div>

<div class="card">

  <div class="newswrap" id="news"></div>
</div>

<div class="card c-amber">
  <h2>시도별 화재 통계 <span style="font-size:12px;font-weight:500;color:var(--sub)">(소방청 · 기준일 2026-07-28)</span></h2>
  <p class="desc">시도를 선택하면 해당 지역 수치로 갱신됩니다.</p>
  <div class="selrow"><select id="sel"></select></div>
  <div class="skpi">
    <div class="sk"><div class="lb">화재접수</div><div class="vl" id="sR">-<small>건</small></div></div>
    <div class="sk"><div class="lb">진행중</div><div class="vl" id="sP">-<small>건</small></div></div>
    <div class="sk" id="skL"><div class="lb">인명피해</div><div class="vl" id="sL">-<small>명</small></div></div>
    <div class="sk" id="skD"><div class="lb">재산피해</div><div class="vl" id="sD">-<small>천원</small></div></div>
  </div>
</div>

<div class="foot" id="foot"></div>
</div>

 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('.tag'),function(b){

  var slice=arr.slice((curPage-1)*PER, curPage*PER);
  box.innerHTML = slice.map(function(it){

  }

    h += (p==='...') ? '<span class="dots">…</span>'
      : '<button class="pg'+(p===curPage?' on':'')+'" data-p="'+p+'">'+p+'</button>';
  });
  h+='<button class="pg'+(curPage===pages?' dis':'')+'" data-p="'+(curPage+1)+'">&rsaquo;</button>';
  pg.innerHTML=h;
  [].forEach.call(pg.querySelectorAll('.pg'),function(b){
    b.onclick=function(){ var p=+b.getAttribute('data-p');
      if(p<1||p>pages||p===curPage) return; curPage=p; renderList(); };
  });
}

function renderMap(){
  if(!mapOK) return;
  layer.clearLayers(); markers={};
  var pts=[];
  filtered().forEach(function(it){
    if(it.lat==null) return;
    var m=L.circleMarker([it.lat,it.lng],{radius:8,color:'#e5342a',weight:2,
      fillColor:'#e5342a',fillOpacity:.62}).addTo(layer);
    m.bindPopup('<b>'+esc(it.type)+'</b><br>'+esc(it.loc)+'<br><span style="color:#e5342a">'+esc(it.time)+'</span>');
    markers[it.lat+','+it.lng+','+it.time]=m;
    pts.push([it.lat,it.lng]);
  });
  if(pts.length===1) map.setView(pts[0],12);
  else if(pts.length>1) map.fitBounds(pts,{padding:[36,36]});
}

function renderAll(){ renderTags(); renderList(); renderMap(); }
